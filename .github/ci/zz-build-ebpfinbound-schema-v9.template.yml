          func (l *ownershipLease) AddAttachment(record ownedAttachmentRecord) error {
          	if l == nil {
          		return nil
          	}
          	l.mu.Lock()
          	defer l.mu.Unlock()
          	if l.closed {
          		return errors.New("ownership lease is closed")
          	}
          	for _, existing := range l.record.Attachments {
          		if sameAttachment(existing, record) {
          			return nil
          		}
          	}
          	l.record.Attachments = append(l.record.Attachments, record)
          	if err := l.persistLocked(); err != nil {
          		l.record.Attachments = l.record.Attachments[:len(l.record.Attachments)-1]
          		return err
          	}
          	return nil
          }

          func (l *ownershipLease) ReplaceAttachment(previous, current ownedAttachmentRecord) error {
          	if l == nil {
          		return nil
          	}
          	l.mu.Lock()
          	defer l.mu.Unlock()
          	if l.closed {
          		return errors.New("ownership lease is closed")
          	}
          	index := -1
          	for candidate, existing := range l.record.Attachments {
          		if sameAttachment(existing, previous) {
          			index = candidate
          			break
          		}
          	}
          	if index < 0 {
          		return errors.New("planned attachment is missing from ownership record")
          	}
          	l.record.Attachments[index] = current
          	if err := l.persistLocked(); err != nil {
          		l.record.Attachments[index] = previous
          		return err
          	}
          	return nil
          }

          func (l *ownershipLease) RemoveAttachment(record ownedAttachmentRecord) error {
          	if l == nil {
          		return nil
          	}
          	l.mu.Lock()
          	defer l.mu.Unlock()
          	if l.closed {
          		return errors.New("ownership lease is closed")
          	}
          	index := -1
          	for candidate, existing := range l.record.Attachments {
          		if sameAttachment(existing, record) {
          			index = candidate
          			break
          		}
          	}
          	if index < 0 {
          		return nil
          	}
          	previous := append([]ownedAttachmentRecord(nil), l.record.Attachments...)
          	l.record.Attachments = append(l.record.Attachments[:index], l.record.Attachments[index+1:]...)
          	if err := l.persistLocked(); err != nil {
          		l.record.Attachments = previous
          		return err
          	}
          	return nil
          }

          func (l *ownershipLease) Release(removeRecord bool) error {
          	if l == nil {
          		return nil
          	}
          	l.mu.Lock()
          	if l.closed {
          		l.mu.Unlock()
          		return nil
          	}
          	l.closed = true
          	lockFile := l.lockFile
          	l.lockFile = nil
          	token := l.record.Token
          	var errs []error
          	if !removeRecord {
          		previousPID := l.record.PID
          		l.record.PID = 0
          		if err := l.persistLocked(); err != nil {
