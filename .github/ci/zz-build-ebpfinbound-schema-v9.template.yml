          		t.Fatal(err)
          	}
          	if err := netlink.LinkSetNsFd(peer, int(clientNS)); err != nil {
          		t.Fatal(err)
          	}
          	if err := netns.Set(clientNS); err != nil {
          		t.Fatal(err)
          	}
          	peer, err = netlink.LinkByName(peerName)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if err := netlink.AddrAdd(peer, &netlink.Addr{IPNet: mustCIDR("198.18.0.2/24")}); err != nil {
          		t.Fatal(err)
          	}
          	if err := netlink.LinkSetUp(peer); err != nil {
          		t.Fatal(err)
          	}
          	loopback, _ := netlink.LinkByName("lo")
          	_ = netlink.LinkSetUp(loopback)
          	if err := netlink.RouteAdd(&netlink.Route{
          		LinkIndex: peer.Attrs().Index,
          		Gw:        net.ParseIP("198.18.0.1"),
          	}); err != nil {
          		t.Fatal(err)
          	}
          	if err := netns.Set(hostNS); err != nil {
          		t.Fatal(err)
          	}
          	runtime.UnlockOSThread()

          	cleanup := func() {
          		runtime.LockOSThread()
          		defer runtime.UnlockOSThread()
          		_ = netns.Set(hostNS)
          		if link, err := netlink.LinkByName(hostName); err == nil {
          			_ = netlink.LinkDel(link)
          		}
          		_ = netns.DeleteNamed(name)
          		_ = clientNS.Close()
          		_ = hostNS.Close()
          	}
          	return clientNS, hostName, cleanup
          }

          func withTestNetNS(target netns.NsHandle, function func() error) (err error) {
          	runtime.LockOSThread()
          	defer runtime.UnlockOSThread()
          	host, err := netns.Get()
          	if err != nil {
          		return err
          	}
          	defer host.Close()
          	if err := netns.Set(target); err != nil {
          		return err
          	}
          	defer func() { err = errors.Join(err, netns.Set(host)) }()
          	return function()
          }

          func mustCIDR(raw string) *net.IPNet {
          	ip, network, err := net.ParseCIDR(raw)
          	if err != nil {
          		panic(err)
          	}
          	network.IP = ip
          	return network
          }
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/ebpfinbound.yml <<'EOF'
          name: eBPF inbound

          on:
            pull_request:
              paths:
                - "control/kern/**"
                - "ebpfinbound/**"
                - ".github/workflows/ebpfinbound.yml"
            push:
              branches:
                - main
                - "fix/ebpfinbound-*"
              paths:
                - "control/kern/**"
                - "ebpfinbound/**"
                - ".github/workflows/ebpfinbound.yml"

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v6
                  with:
                    fetch-depth: 0
                    submodules: recursive
                - uses: actions/setup-go@v6
                  with:
                    go-version: 1.26.7
                    cache: false
                - name: Install eBPF dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y clang llvm libbpf-dev iproute2
                - name: Generate, test and verify boundaries
                  shell: bash
                  run: |
                    set -euxo pipefail
                    cd ebpfinbound
                    go generate ./...
                    go mod tidy
                    gofmt -w .
                    git diff --exit-code -- .
                    go test -race ./...
                    go vet ./...
                    go test -tags dae_stub_ebpf ./...
                    go build ./...
                    deps=$(go list -deps ./...)
                    if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
                      echo "private daemon, policy, outbound, QUIC, qpack, or logging dependency leaked into capture operation" >&2
                      exit 1
                    fi
                    ! grep -R 'CloneGeneration\|CommitGeneration\|OpenGeneration' --include='*.go' .
                - name: Privileged lifecycle and traffic
                  shell: bash
                  run: |
                    set -euxo pipefail
                    sudo mkdir -p /run/netns
                    cd ebpfinbound
                    sudo --preserve-env=PATH env HOME="$HOME" \
                      go test -tags=integration -run TestPrivilegedCaptureLifecycleAndTraffic -count=1 -v .
                    ! ip link show dae-ebpf0
                    ! ip netns list | grep -q '^dae-ebpf-inbound'
          EOF

          gofmt -w ebpfinbound
          git diff --check

      - name: Generate and run provider tests
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/dae-ebpfinbound-final
          git submodule update --init --recursive
          cd ebpfinbound
          go generate ./...
          go mod tidy
          gofmt -w .
          go test -race ./...
          go vet ./...
          go test -tags dae_stub_ebpf ./...
          go build ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo "private daemon, policy, outbound, QUIC, qpack, or logging dependency leaked into capture operation" >&2
            exit 1
          fi
          ! grep -R 'CloneGeneration\|CommitGeneration\|OpenGeneration' --include='*.go' .
          git diff --check

      - name: Privileged lifecycle and real traffic
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /run/netns
          cd /tmp/dae-ebpfinbound-final/ebpfinbound
          sudo --preserve-env=PATH env HOME="$HOME" \
            go test -tags=integration -run TestPrivilegedCaptureLifecycleAndTraffic -count=1 -v .
          ! ip link show dae-ebpf0
          ! ip netns list | grep -q '^dae-ebpf-inbound'

      - name: Run aw-checker Schema-v9 architecture scan
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/aw-checker /tmp/infra
          git clone https://github.com/wignerStan/aw-checker /tmp/aw-checker
          git -C /tmp/aw-checker checkout 55512af91b2a5783242be2f166db1d88b744b882
          git clone https://github.com/wignerStan/infra /tmp/infra
          cd /tmp/aw-checker
          cargo run -p aw-checker -- \
            scan --domains architecture /tmp/dae-ebpfinbound-final/ebpfinbound \
            | tee /tmp/aw-checker-ebpfinbound.txt

      - name: Publish one clean commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd /tmp/dae-ebpfinbound-final
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            control/kern/tproxy.c \
            ebpfinbound \
            .github/workflows/ebpfinbound.yml
          git commit -m "feat(ebpfinbound): own capture resources through one runtime"
          git push origin \
            HEAD:refs/heads/fix/ebpfinbound-schema-v9-ownership \
            --force
