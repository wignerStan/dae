          		link, err := netlink.LinkByName(name)
          		if err != nil {
          			if !isMissingNetlinkError(err) {
          				errs = append(errs, err)
          			}
          			continue
          		}
          		if link.Attrs() == nil || link.Attrs().Alias != record.Token {
          			errs = append(errs, fmt.Errorf("refuse to delete link %s without matching ownership token", name))
          			continue
          		}
          		if err := netlink.LinkDel(link); err != nil && !isMissingNetlinkError(err) {
          			errs = append(errs, err)
          		}
          	}
          	if namespaceExists && namespaceOwned {
          		if err := netns.DeleteNamed(record.Namespace); err != nil && !errors.Is(err, os.ErrNotExist) {
          			errs = append(errs, err)
          		}
          	}
          	return errors.Join(errs...)
          }

          func recordedNamespaceOwnership(record ownershipRecord) (exists bool, owned bool, err error) {
          	if record.Namespace == "" {
          		return false, false, nil
          	}
          	target, err := netns.GetFromName(record.Namespace)
          	if err != nil {
          		if errors.Is(err, os.ErrNotExist) {
          			return false, false, nil
          		}
          		return false, false, err
          	}
          	defer target.Close()
          	err = withNetNS(target, func() error {
          		if record.PeerLink == "" {
          			return nil
          		}
          		link, lookupErr := netlink.LinkByName(record.PeerLink)
          		if lookupErr != nil {
          			if isMissingNetlinkError(lookupErr) {
          				return nil
          			}
          			return lookupErr
          		}
          		owned = link.Attrs() != nil && link.Attrs().Alias == record.Token
          		return nil
          	})
          	return true, owned, err
          }
