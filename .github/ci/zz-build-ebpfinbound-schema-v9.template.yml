name: Build Schema-v9 eBPF inbound candidate

on:
  push:
    branches:
      - tmp/build-ebpfinbound-schema-v9-20260906-v1

permissions:
  contents: write

concurrency:
  group: build-ebpfinbound-schema-v9-20260906-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/build-ebpfinbound-schema-v9-20260906-v1
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2

      - name: Build one clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            main \
            tmp/validate-ebpfinbound-one-shot-20260901

          rm -rf /tmp/dae-ebpfinbound-final
          git worktree add --detach /tmp/dae-ebpfinbound-final origin/main
          git archive origin/tmp/validate-ebpfinbound-one-shot-20260901 ebpfinbound \
            | tar -x -C /tmp/dae-ebpfinbound-final

          cd /tmp/dae-ebpfinbound-final
          rm -rf ebpfinbound/cmd

          python3 - <<'PY'
          from pathlib import Path

          # Put the capture-only seam in the canonical C source. Generation no
          # longer rewrites a copied source file by matching a long signature.
          path = Path("control/kern/tproxy.c")
          text = path.read_text()
          signature = """static __noinline __s64 route(const __u32 *flag, const void *l4hdr,
          			      const __be32 *saddr, const __be32 *daddr,
          			      const __be32 *mac)
          {"""
          seam = signature + """
          #ifdef DAE_CAPTURE_ONLY
          	/* Routing policy is owned by the embedding userspace engine. */
          	return (__s64)OUTBOUND_CONTROL_PLANE_ROUTING;
          #endif"""
          if "Routing policy is owned by the embedding userspace engine." not in text:
              if signature not in text:
                  raise SystemExit("route function marker not found in control/kern/tproxy.c")
              text = text.replace(signature, seam, 1)
              path.write_text(text)

          # Fix duplicate type generation: bpf2go already emits global map
          # key/value types unless -no-global-types is selected.
          path = Path("ebpfinbound/internal/generate.py")
          text = path.read_text()
          start = text.index("with tempfile.TemporaryDirectory")
          replacement = '''with tempfile.TemporaryDirectory(prefix="dae-ebpfinbound-generate-") as temporary:
              kern = Path(temporary) / "kern"
              shutil.copytree(source, kern, symlinks=True)
              tproxy = kern / "tproxy.c"
              if "DAE_CAPTURE_ONLY" not in tproxy.read_text():
                  raise SystemExit("capture-only seam missing from dae BPF source")

              command = [
                  "go", "run", "-mod=mod", "github.com/cilium/ebpf/cmd/bpf2go@v0.20.0",
                  "-cc", os.environ.get("BPF_CLANG", "clang"),
                  "-no-strip",
                  "-no-global-types",
                  "-cflags", "-DMAX_MATCH_SET_LEN=1024 -DDAE_CAPTURE_ONLY=1 -O2 -Wall -Werror",
                  "-target", "bpfel,bpfeb",
                  "-type", "dae_param",
                  "-type", "tuples_key",
                  "-type", "conn_state",
                  "-type", "routing_handoff_entry",
                  "bpf", str(tproxy), "--", f"-I{kern / 'headers'}",
              ]
              environment = os.environ.copy()
              environment["GOPACKAGE"] = "ebpfinbound"
              subprocess.run(command, cwd=module, env=environment, check=True)

          '''
          tail = text.index('for name in ("bpf_bpfel.go", "bpf_bpfeb.go"):')
          text = text[:start] + replacement + text[tail:]
          path.write_text(text)

          # Record every TC effect immediately and make each cleanup callback
          # remove its durable record only after filter/qdisc cleanup succeeds.
          path = Path("ebpfinbound/attach_linux.go")
          text = path.read_text()
          text = text.replace(
              "return attachInterfacePair(link, false,",
              "return attachInterfacePair(r.ownership, link, false,",
          )
          text = text.replace(
              "peerRecord, peerCleanup, attachErr = attachSingleFilter(r.netns.peerLink, true, peerFilter)",
              "peerRecord, peerCleanup, attachErr = attachSingleFilter(r.ownership, r.netns.peerLink, true, peerFilter)",
          )
          text = text.replace(
              "hostRecord, hostCleanup, err := attachSingleFilter(r.netns.hostLink, false, hostFilter)",
              "hostRecord, hostCleanup, err := attachSingleFilter(r.ownership, r.netns.hostLink, false, hostFilter)",
          )
          text = text.replace(
              "func attachInterfacePair(link netlink.Link, inNetNS bool, first, second *netlink.BpfFilter)",
              "func attachInterfacePair(owner *ownershipLease, link netlink.Link, inNetNS bool, first, second *netlink.BpfFilter)",
          )
          text = text.replace(
              "firstRecord, firstCleanup, err := attachSingleFilter(link, inNetNS, first)",
              "firstRecord, firstCleanup, err := attachSingleFilter(owner, link, inNetNS, first)",
          )
          text = text.replace(
              "secondRecord, secondCleanup, err := attachSingleFilter(link, inNetNS, second)",
              "secondRecord, secondCleanup, err := attachSingleFilter(owner, link, inNetNS, second)",
          )
          text = text.replace(
              "func attachSingleFilter(link netlink.Link, inNetNS bool, filter *netlink.BpfFilter)",
              "func attachSingleFilter(owner *ownershipLease, link netlink.Link, inNetNS bool, filter *netlink.BpfFilter)",
          )
          function_start = text.index("func attachSingleFilter(")
          function_end = text.index("\nfunc ensureClsact", function_start)
          replacement = r'''func attachSingleFilter(owner *ownershipLease, link netlink.Link, inNetNS bool, filter *netlink.BpfFilter) (ownedTCAttachment, []func() error, error) {
          	if link == nil || link.Attrs() == nil || filter == nil || filter.Fd < 0 {
          		return ownedTCAttachment{}, nil, errors.New("invalid BPF TC filter")
          	}
          	qdisc, qdiscCreated, err := ensureClsact(link)
          	if err != nil {
          		return ownedTCAttachment{}, nil, err
          	}
          	cleanupQdisc := func() error {
          		if !qdiscCreated {
          			return nil
          		}
          		return deleteOwnedClsactIfEmpty(link)
          	}
          	planned := ownedAttachmentRecord{
          		Interface:    link.Attrs().Name,
          		InNetNS:      inNetNS,
          		Parent:       filter.Attrs().Parent,
          		Handle:       filter.Attrs().Handle,
          		Priority:     filter.Attrs().Priority,
          		Name:         filter.Name,
          		QdiscCreated: qdiscCreated,
          	}
          	recorded := false
          	if owner != nil {
          		if err := owner.AddAttachment(planned); err != nil {
          			return ownedTCAttachment{}, nil, errors.Join(
          				fmt.Errorf("record planned TC attachment: %w", err),
          				cleanupQdisc(),
          			)
          		}
          		recorded = true
          	}
          	forgetPlanned := func() error {
          		if !recorded || owner == nil {
          			return nil
          		}
          		if err := owner.RemoveAttachment(planned); err != nil {
          			return err
          		}
          		recorded = false
          		return nil
          	}
          	cleanupPlannedEffect := func(filterVisible bool) error {
          		var cleanupErr error
          		if filterVisible {
          			cleanupErr = deleteOwnedFilter(planned)
          		} else {
          			cleanupErr = cleanupQdisc()
          		}
          		if cleanupErr != nil {
          			return cleanupErr
          		}
          		return forgetPlanned()
          	}
          	if err := assertTCSlotFree(link, filter); err != nil {
          		return ownedTCAttachment{}, nil, errors.Join(err, cleanupPlannedEffect(false))
          	}
          	if err := netlink.FilterAdd(filter); err != nil {
          		return ownedTCAttachment{}, nil, errors.Join(
          			fmt.Errorf("add capture TC filter %s: %w", filter.Name, err),
          			cleanupPlannedEffect(false),
          		)
          	}
          	actual, err := findTCFilter(link, filter.Attrs().Parent, filter.Attrs().Handle, filter.Attrs().Priority)
          	if err != nil {
          		return ownedTCAttachment{}, nil, errors.Join(err, cleanupPlannedEffect(true))
          	}
          	bpfActual, ok := actual.(*netlink.BpfFilter)
          	if !ok || bpfActual.Name != filter.Name {
          		return ownedTCAttachment{}, nil, errors.Join(
          			fmt.Errorf("capture TC filter identity mismatch on %s", link.Attrs().Name),
          			cleanupPlannedEffect(true),
          		)
          	}
          	record := planned
          	record.ProgramID = bpfActual.Id
          	if owner != nil {
          		if err := owner.ReplaceAttachment(planned, record); err != nil {
          			return ownedTCAttachment{}, nil, errors.Join(
          				fmt.Errorf("record attached TC filter identity: %w", err),
          				cleanupPlannedEffect(true),
          			)
          		}
          		recorded = false
          	}
          	cleanup := func() error {
          		if err := deleteOwnedFilter(record); err != nil {
          			return err
          		}
          		if owner != nil {
          			return owner.RemoveAttachment(record)
          		}
          		return nil
          	}
          	return ownedTCAttachment{record: record}, []func() error{cleanup}, nil
          }
          '''
          text = text[:function_start] + replacement + text[function_end:]

          delete_start = text.index("func deleteOwnedFilter(")
          delete_end = text.index("\nfunc cleanupStaleAttachments", delete_start)
          replacement = r'''func deleteOwnedFilter(record ownedAttachmentRecord) error {
          	remove := func() error {
          		link, err := netlink.LinkByName(record.Interface)
          		if err != nil {
          			if isMissingNetlinkError(err) {
          				return nil
          			}
          			return err
          		}
          		filter, err := findTCFilter(link, record.Parent, record.Handle, record.Priority)
          		if err != nil {
          			if !strings.Contains(err.Error(), "not found") {
          				return err
          			}
          		} else {
          			bpfFilter, ok := filter.(*netlink.BpfFilter)
          			if !ok || bpfFilter.Name != record.Name || (record.ProgramID != 0 && bpfFilter.Id != record.ProgramID) {
          				return fmt.Errorf("refuse to delete TC filter on %s: ownership identity changed", record.Interface)
          			}
          			if err := netlink.FilterDel(filter); err != nil && !isMissingNetlinkError(err) {
          				return fmt.Errorf("delete owned TC filter %s: %w", record.Name, err)
          			}
          		}
          		if record.QdiscCreated {
          			return deleteOwnedClsactIfEmpty(link)
          		}
          		return nil
          	}
          	if !record.InNetNS {
          		return remove()
          	}
          	return withNamedNetNS(captureNetNSName, remove)
          }

          func deleteOwnedClsactIfEmpty(link netlink.Link) error {
          	if link == nil || link.Attrs() == nil || !interfaceFiltersEmpty(link) {
          		return nil
          	}
          	qdiscs, err := netlink.QdiscList(link)
          	if err != nil {
          		return fmt.Errorf("list qdiscs on %s before cleanup: %w", link.Attrs().Name, err)
          	}
          	for _, qdisc := range qdiscs {
          		if qdisc == nil || qdisc.Type() != "clsact" {
          			continue
          		}
          		if err := netlink.QdiscDel(qdisc); err != nil && !isMissingNetlinkError(err) {
          			return fmt.Errorf("delete owned clsact qdisc on %s: %w", link.Attrs().Name, err)
          		}
          		return nil
          	}
          	return nil
          }
          '''
          text = text[:delete_start] + replacement + text[delete_end:]

          ns_start = text.index("func withNamedNetNS(")
          ns_end = text.index("\nfunc interfaceFiltersEmpty", ns_start)
          replacement = r'''func withNamedNetNS(name string, function func() error) error {
          	target, err := netns.GetFromName(name)
          	if err != nil {
          		if errors.Is(err, os.ErrNotExist) {
          			return nil
          		}
          		return err
          	}
          	defer target.Close()
          	return withNetNS(target, function)
          }
          '''
          text = text[:ns_start] + replacement + text[ns_end:]

          # IPv6 is part of the public listener contract. Do not advertise
          # Ready when required IPv6 forwarding setup was skipped.
          text = text.replace(
              '''		if err := manager.Set("/proc/sys/net/ipv6/conf/all/forwarding", "1"); err != nil && !errors.Is(err, os.ErrNotExist) {
          			return err
          		}''',
              '''		if err := manager.Set("/proc/sys/net/ipv6/conf/all/forwarding", "1"); err != nil {
          			return err
          		}''',
          )
          text = text.replace(
              '''			if err := manager.Set(path, setting.value); err != nil {
          				if setting.family == "ipv6" && errors.Is(err, os.ErrNotExist) {
          					continue
          				}
          				return err
          			}''',
              '''			if err := manager.Set(path, setting.value); err != nil {
          				return err
          			}''',
          )
          path.write_text(text)

          # Runtime retains the ownership record whenever cleanup is incomplete.
          path = Path("ebpfinbound/runtime_linux.go")
          text = path.read_text()
          text = text.replace(
              "func New(ctx context.Context, options Options) (Runtime, error) {",
              "func New(ctx context.Context, options Options) (_ Runtime, returnErr error) {",
              1,
          )
          old = '''	cleanupOwnership := true
          	defer func() {
          		if cleanupOwnership {
          			_ = ownership.Close()
          		}
          	}()'''
          new = '''	cleanupOwnership := true
          	defer func() {
          		if cleanupOwnership {
          			returnErr = errors.Join(returnErr, ownership.Release(!ownership.HasResidualEffects()))
          		}
          	}()'''
          if old not in text:
              raise SystemExit("runtime ownership defer marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '''	ns, err := newCaptureNetNS(ctx, logger, ownership)''',
              '''	ns, err := newCaptureNetNS(ctx, logger, ownership)''',
              1,
          )
          old = '''	attachments, detachFunctions, err := runtime.attachDatapath()
          	if err != nil {
          		cancel()
          		return nil, err
          	}
          	runtime.detachFunctions = detachFunctions
          	if err := ownership.SetAttachments(attachmentRecords(attachments)); err != nil {
          		_ = runCleanupReverse(detachFunctions)
          		cancel()
          		return nil, fmt.Errorf("record attached traffic hooks: %w", err)
          	}'''
          new = '''	_, detachFunctions, err := runtime.attachDatapath()
          	if err != nil {
          		cancel()
          		return nil, err
          	}
          	runtime.detachFunctions = detachFunctions'''
          if old not in text:
              raise SystemExit("runtime attachment persistence marker missing")
          text = text.replace(old, new, 1)
          old = '''	if ownership != nil {
          		if err := ownership.Close(); err != nil {
          			errs = append(errs, err)
          		}
          	}
          	return errors.Join(errs...)'''
          new = '''	if ownership != nil {
          		if err := ownership.Release(!ownership.HasResidualEffects()); err != nil {
          			errs = append(errs, err)
          		}
          	}
          	return errors.Join(errs...)'''
          if old not in text:
              raise SystemExit("runtime close ownership marker missing")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Preflight must report every host setting the auto-configurer owns.
          path = Path("ebpfinbound/preflight_linux.go")
          text = path.read_text()
          old = '''	checks := map[string]string{
          		"/proc/sys/net/ipv4/ip_forward":                  "1",
          		"/proc/sys/net/ipv6/conf/all/forwarding":         "1",
          		"/proc/sys/net/ipv4/conf/all/src_valid_mark":     "1",
          		"/proc/sys/net/ipv4/conf/default/src_valid_mark": "1",
          	}'''
          new = '''	checks := map[string]string{
          		"/proc/sys/net/ipv4/conf/all/rp_filter":          "0",
          		"/proc/sys/net/ipv4/conf/all/arp_filter":         "0",
          		"/proc/sys/net/ipv4/ip_forward":                  "1",
          		"/proc/sys/net/ipv6/conf/all/forwarding":         "1",
          		"/proc/sys/net/ipv4/conf/all/src_valid_mark":     "1",
          		"/proc/sys/net/ipv4/conf/default/src_valid_mark": "1",
          	}'''
          if old not in text:
              raise SystemExit("preflight global checks marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '''		if err != nil {
          			if strings.Contains(path, "/ipv6/") && errors.Is(err, os.ErrNotExist) {
          				continue
          			}
          			problems = append(problems, fmt.Sprintf("%s unavailable: %v", path, err))
          			continue
          		}''',
              '''		if err != nil {
          			problems = append(problems, fmt.Sprintf("%s unavailable: %v", path, err))
          			continue
          		}''',
              1,
          )
          path.write_text(text)
          PY

          cat > ebpfinbound/netns_thread_linux.go <<'EOF'
          //go:build linux

          // SPDX-License-Identifier: AGPL-3.0-only

          package ebpfinbound

          import (
          	"errors"
          	"fmt"
          	"runtime"

          	"github.com/vishvananda/netns"
          )

          // onIsolatedOSThread contains thread-local namespace state inside a
          // disposable worker. If namespace restoration fails, the goroutine
          // exits while locked and the Go runtime terminates that OS thread.
          func onIsolatedOSThread(function func() error) error {
          	result := make(chan error, 1)
          	go func() {
          		runtime.LockOSThread()
          		unlock := true
          		defer func() {
          			if unlock {
          				runtime.UnlockOSThread()
          			}
          		}()

          		current, err := netns.Get()
          		if err != nil {
          			result <- fmt.Errorf("get current network namespace: %w", err)
          			return
          		}
          		defer current.Close()

          		var operationErr error
          		if function != nil {
          			operationErr = function()
          		}
          		if restoreErr := netns.Set(current); restoreErr != nil {
          			unlock = false
          			operationErr = errors.Join(operationErr, fmt.Errorf("restore network namespace: %w", restoreErr))
          		}
          		result <- operationErr
          	}()
          	return <-result
          }

          func withNetNS(target netns.NsHandle, function func() error) error {
          	if !target.IsOpen() {
          		return errors.New("target network namespace is closed")
          	}
          	return onIsolatedOSThread(func() error {
          		if err := netns.Set(target); err != nil {
          			return fmt.Errorf("enter network namespace: %w", err)
          		}
          		if function == nil {
          			return nil
          		}
          		return function()
          	})
          }
          EOF

          cat > ebpfinbound/netns_linux.go <<'EOF'
          //go:build linux

          // SPDX-License-Identifier: AGPL-3.0-only

          package ebpfinbound

          import (
          	"context"
          	"errors"
          	"fmt"
          	"log/slog"
          	"net"
          	"os"
          	"strings"
          	"sync"

          	"github.com/vishvananda/netlink"
          	"github.com/vishvananda/netns"
          	"golang.org/x/sys/unix"
          )

          const (
          	captureNetNSName   = "dae-ebpf-inbound"
          	captureHostLink    = "dae-ebpf0"
          	capturePeerLink    = "dae-ebpf1"
          	captureLinkTxQLen  = 1000
          	captureRouteTable  = 2023
          	captureTProxyMark  = uint32(0x08000000)
          )

          type captureNetNS struct {
          	log              *slog.Logger
          	token            string
          	mu               sync.Mutex
          	closed           bool
          	hostNS           netns.NsHandle
          	captureNS        netns.NsHandle
          	hostLink         netlink.Link
          	peerLink         netlink.Link
          	createdHostLink  bool
          	createdNamespace bool
          	hostSysctls      *sysctlManager
          }

          func newCaptureNetNS(ctx context.Context, log *slog.Logger, owner *ownershipLease) (*captureNetNS, error) {
          	if ctx == nil {
          		ctx = context.Background()
          	}
          	if err := ctx.Err(); err != nil {
          		return nil, err
          	}
          	token := ""
          	if owner != nil {
          		token = owner.Token()
          	}
          	ns := &captureNetNS{
          		log:       log,
          		token:     token,
          		hostNS:    netns.None(),
          		captureNS: netns.None(),
          	}
          	ns.hostSysctls = newSysctlManager(func(mutations []sysctlMutation) error {
          		if owner == nil {
          			return nil
          		}
          		return owner.SetSysctls(mutations)
          	})
          	if err := ns.setup(ctx); err != nil {
          		_ = ns.Close()
          		return nil, err
          	}
          	return ns, nil
          }

          func (ns *captureNetNS) setup(ctx context.Context) error {
          	return onIsolatedOSThread(func() error {
          		return ns.setupOnThread(ctx)
          	})
          }

          func (ns *captureNetNS) setupOnThread(ctx context.Context) error {
          	var err error
          	ns.hostNS, err = netns.Get()
          	if err != nil {
          		return fmt.Errorf("get host network namespace: %w", err)
          	}
          	if err := ctx.Err(); err != nil {
          		return err
          	}
          	if resources := existingCaptureResourcesWithoutRecord(); len(resources) > 0 {
          		return fmt.Errorf("refuse existing unowned capture resources: %s", strings.Join(resources, ", "))
          	}

          	veth := &netlink.Veth{
          		LinkAttrs: netlink.LinkAttrs{Name: captureHostLink, TxQLen: captureLinkTxQLen, Alias: ns.token},
          		PeerName:  capturePeerLink,
          		PeerTxQLen: captureLinkTxQLen,
          	}
          	if err := netlink.LinkAdd(veth); err != nil {
          		return fmt.Errorf("create capture veth pair: %w", err)
          	}
          	ns.createdHostLink = true
          	ns.hostLink, err = netlink.LinkByName(captureHostLink)
          	if err != nil {
          		return fmt.Errorf("lookup host capture link: %w", err)
          	}
          	if err := netlink.LinkSetAlias(ns.hostLink, ns.token); err != nil {
          		return fmt.Errorf("mark host capture link ownership: %w", err)
          	}
          	peerInHost, err := netlink.LinkByName(capturePeerLink)
          	if err != nil {
          		return fmt.Errorf("lookup peer capture link: %w", err)
          	}
          	if err := netlink.LinkSetAlias(peerInHost, ns.token); err != nil {
          		return fmt.Errorf("mark peer capture link ownership: %w", err)
          	}
          	if err := netlink.LinkSetUp(ns.hostLink); err != nil {
          		return fmt.Errorf("bring host capture link up: %w", err)
          	}

          	ns.captureNS, err = netns.NewNamed(captureNetNSName)
          	if err != nil {
          		return fmt.Errorf("create named capture network namespace: %w", err)
          	}
          	ns.createdNamespace = true
          	if err := netns.Set(ns.hostNS); err != nil {
          		return fmt.Errorf("restore host network namespace: %w", err)
          	}
          	if err := netlink.LinkSetNsFd(peerInHost, int(ns.captureNS)); err != nil {
          		return fmt.Errorf("move capture peer into namespace: %w", err)
          	}
          	if err := ns.setupHostSide(); err != nil {
          		return err
          	}
          	return ns.withUnlocked(ns.setupNamespaceSide)
          }

          func (ns *captureNetNS) setupHostSide() error {
          	settings := []struct {
          		family string
          		key    string
          		value  string
          	}{
          		{"ipv4", "rp_filter", "0"},
          		{"ipv4", "arp_filter", "0"},
          		{"ipv4", "accept_local", "1"},
          		{"ipv6", "disable_ipv6", "0"},
          		{"ipv6", "forwarding", "1"},
          	}
          	for _, setting := range settings {
          		path, err := interfaceSysctlPath(setting.family, captureHostLink, setting.key)
          		if err != nil {
          			return err
          		}
          		if err := ns.hostSysctls.Set(path, setting.value); err != nil {
          			return err
          		}
          	}
          	address := &netlink.Addr{
          		IPNet: &net.IPNet{
          			IP:   net.ParseIP("fe80::ecee:eeff:feee:eeee"),
          			Mask: net.CIDRMask(128, 128),
          		},
          	}
          	if err := netlink.AddrAdd(ns.hostLink, address); err != nil && !errors.Is(err, unix.EEXIST) {
          		return fmt.Errorf("add host capture IPv6 address: %w", err)
          	}
          	return nil
          }

          func (ns *captureNetNS) setupNamespaceSide() error {
          	var err error
          	ns.peerLink, err = netlink.LinkByName(capturePeerLink)
          	if err != nil {
          		return fmt.Errorf("lookup capture peer in namespace: %w", err)
          	}
          	if err := netlink.LinkSetAlias(ns.peerLink, ns.token); err != nil {
          		return fmt.Errorf("mark peer capture link ownership: %w", err)
