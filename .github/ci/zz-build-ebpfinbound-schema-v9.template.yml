          	var errs []error
          	if namespaceErr != nil {
          		errs = append(errs, namespaceErr)
          	} else if namespaceExists && !namespaceOwned {
          		errs = append(errs, fmt.Errorf("refuse to delete namespace %s without matching peer ownership token", record.Namespace))
          	}

          	for _, name := range []string{record.PeerLink, record.HostLink} {
          		if name == "" {
          			continue
