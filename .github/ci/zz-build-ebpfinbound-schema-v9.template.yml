          func (l *ownershipLease) HasResidualEffects() bool {
          	if l == nil {
          		return false
          	}
          	l.mu.Lock()
          	recorded := len(l.record.Attachments) != 0 || len(l.record.Sysctls) != 0
          	l.mu.Unlock()
