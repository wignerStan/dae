          # Ownership architecture

          This module is one Schema-v9 `effect_tool(application_support)` owner.
          Its exact operation is `transparent_flow_capture`.

          ## Public boundary

          The module owns a complete capture outcome:

          - resolve and validate capture interfaces;
          - create the private network namespace and listener set;
          - load capture-only BPF programs;
          - attach and detach owned TC/cgroup hooks;
          - expose factual flow metadata;
          - restore or durably record host mutations during shutdown and recovery.

          It must remain ignorant of DNS policy, sniffing, FakeIP, routing
          decisions, proxy protocols, outbounds, and dialing. Those meanings stay
          with the embedding traffic engine.

          `Runtime.Listeners` exposes borrowed plumbing. The runtime is the only
          owner allowed to close those sockets. Reload swaps consumer handlers
          above this boundary; it does not clone or republish listener file
          descriptors.

          ## Resource lifecycle

          ```text
          ownership journal
            -> namespace and veth lease
              -> BPF collection and listeners
                -> individually journaled TC attachments
                  -> ready runtime
          ```

          Every persistent host effect is recorded before or immediately when it
          becomes visible. Cleanup removes the durable record only after the
          corresponding effect is gone. A failed cleanup releases the process
          lock but preserves a recovery-required record with no live PID.

          Namespace work executes on disposable, OS-thread-locked workers.
          Failure to restore the caller namespace terminates the contaminated
          worker thread instead of returning it to the Go scheduler.

          ## Generated BPF boundary

          `control/kern/tproxy.c` owns the small `DAE_CAPTURE_ONLY` compile-time
          seam. The generator copies canonical source and compiles it; it does not
          rewrite policy code using a long source-text signature.
          EOF

