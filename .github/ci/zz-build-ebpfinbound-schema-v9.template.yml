          			if decodeErr := json.Unmarshal(raw, &current); decodeErr != nil {
          				errs = append(errs, fmt.Errorf("decode ownership record before removal: %w", decodeErr))
          			} else if current.Token != token {
          				errs = append(errs, errors.New("refuse to remove ownership record: ownership token changed"))
