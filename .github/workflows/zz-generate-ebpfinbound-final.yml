name: Generate and validate final eBPF inbound

on:
  push:
    branches:
      - tmp/generate-ebpfinbound-final-20260901

permissions:
  contents: read

concurrency:
  group: generate-ebpfinbound-final
  cancel-in-progress: true

jobs:
  generate-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Install eBPF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/ebpfinbound-final/part-* | base64 -d > /tmp/ebpfinbound-source.tar.gz
          echo 'e6d6c3ed81073ecf814898d5e6bd0bd1c9b3e8c7773df2dac461e1c1767212fa  /tmp/ebpfinbound-source.tar.gz' | sha256sum -c -
          rm -rf ebpfinbound
          mkdir ebpfinbound
          tar -xzf /tmp/ebpfinbound-source.tar.gz --strip-components=1 -C ebpfinbound
          chmod +x ebpfinbound/internal/generate-bpf.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path('ebpfinbound/internal/generate-bpf.sh')
          text = script.read_text()
          text = text.replace('  -type dae_param \\\n', '')
          script.write_text(text)
          Path('ebpfinbound/abi_linux.go').write_text(r'''//go:build linux

// SPDX-License-Identifier: AGPL-3.0-only

package ebpfinbound

// bpfDaeParam mirrors struct dae_param in dae's reviewed capture source.
// It is maintained explicitly because clang emits duplicate BTF declarations
// for this const-volatile data-section type on some supported toolchains.
type bpfDaeParam struct {
	TproxyPort           uint32
	ControlPlanePid      uint32
	Dae0Ifindex          uint32
	DaeNetnsId           uint32
	Dae0peerMac          [6]uint8
	PaddingAfterMac      [2]uint8
	UseRedirectPeer      uint8
	HasBpfGetCurrentTask uint8
	Padding2             uint16
	DaeSocketMark        uint32
}
''')
          Path('ebpfinbound/abi_linux_test.go').write_text(r'''//go:build linux

package ebpfinbound

import (
	"testing"
	"unsafe"
)

func TestDaeParamABI(t *testing.T) {
	var value bpfDaeParam
	if size := unsafe.Sizeof(value); size != 32 {
		t.Fatalf("dae_param size = %d, want 32", size)
	}
	checks := []struct {
		name string
		got  uintptr
		want uintptr
	}{
		{"TproxyPort", unsafe.Offsetof(value.TproxyPort), 0},
		{"ControlPlanePid", unsafe.Offsetof(value.ControlPlanePid), 4},
		{"Dae0Ifindex", unsafe.Offsetof(value.Dae0Ifindex), 8},
		{"DaeNetnsId", unsafe.Offsetof(value.DaeNetnsId), 12},
		{"Dae0peerMac", unsafe.Offsetof(value.Dae0peerMac), 16},
		{"UseRedirectPeer", unsafe.Offsetof(value.UseRedirectPeer), 24},
		{"HasBpfGetCurrentTask", unsafe.Offsetof(value.HasBpfGetCurrentTask), 25},
		{"DaeSocketMark", unsafe.Offsetof(value.DaeSocketMark), 28},
	}
	for _, check := range checks {
		if check.got != check.want {
			t.Errorf("%s offset = %d, want %d", check.name, check.got, check.want)
		}
	}
}
''')
          PY
      - name: Generate checked-in BPF assets
        working-directory: ebpfinbound
        shell: bash
        run: |
          set -euxo pipefail
          go generate ./...
          go mod tidy
          find . -name '*.go' -print0 | xargs -0 gofmt -w
          test -s bpf_bpfel.go
          test -s bpf_bpfeb.go
          test -s bpf_bpfel.o
          test -s bpf_bpfeb.o
          test -s go.sum
      - name: Validate standalone module
        working-directory: ebpfinbound
        shell: bash
        run: |
          set -euxo pipefail
          go test -race ./...
          go vet ./...
          go build ./cmd/dae-ebpf-tool
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'forbidden daemon, policy, outbound, QUIC, or logging dependency leaked into standalone module' >&2
            exit 1
          fi
          if grep -R -nE 'CloneGeneration|CommitGeneration|OpenGeneration|unix\.Dup' --include='*.go' .; then
            echo 'unsafe listener generation API survived' >&2
            exit 1
          fi
      - name: Privileged lifecycle and ownership tests
        working-directory: ebpfinbound
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /sys/fs/bpf /run/netns
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          sudo --preserve-env=PATH env HOME="$HOME" go test -tags=integration -run '^TestPrivileged' -count=1 -v .
          ! ip link show daecap0
          ! ip netns list | grep -q '^dae-ebpfinbound'
      - name: Package complete reviewed source
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf /tmp/ebpfinbound-final.tar.gz ebpfinbound
          sha256sum /tmp/ebpfinbound-final.tar.gz > /tmp/ebpfinbound-final.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ebpfinbound-final-source
          path: |
            /tmp/ebpfinbound-final.tar.gz
            /tmp/ebpfinbound-final.sha256
          retention-days: 7
