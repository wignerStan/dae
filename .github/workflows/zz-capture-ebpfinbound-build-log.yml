name: Capture eBPF inbound build failure

on:
  push:
    branches:
      - tmp/build-ebpfinbound-schema-v9-20260906-v1

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/build-ebpfinbound-schema-v9-20260906-v1
      - name: Capture failed job tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/101429651385/logs" \
            -o /tmp/job.log
          tail -n 250 /tmp/job.log > .github/ebpfinbound-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ebpfinbound-build-error.log
          git commit -m "ci: record eBPF inbound build failure"
          git push origin HEAD:tmp/build-ebpfinbound-schema-v9-20260906-v1
