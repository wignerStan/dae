name: Recover standalone eBPF inbound module

on:
  push:
    branches:
      - refactor/ebpf-inbound-module

permissions:
  contents: read

concurrency:
  group: recover-ebpfinbound-module
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/ebpf-inbound-module
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false
      - name: Reconstruct module candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ebpfinbound-module/part-* | base64 -d > /tmp/ebpfinbound-module.tar.gz
          sha256sum /tmp/ebpfinbound-module.tar.gz | tee /tmp/ebpfinbound-module.sha256
          gzip -t /tmp/ebpfinbound-module.tar.gz

          git reset --hard 23924b96e4cf7a75586b7d5e51f5b86c7a212acf
          rm -rf ebpfinbound
          mkdir -p ebpfinbound
          cp pkg/ebpfinbound/api.go ebpfinbound/api.go
          cp pkg/ebpfinbound/capture.go ebpfinbound/capture.go
          cp pkg/ebpfinbound/oob_linux.go ebpfinbound/oob_linux.go
          cp pkg/ebpfinbound/oob_other.go ebpfinbound/oob_other.go
          cp pkg/ebpfinbound/api_test.go ebpfinbound/api_test.go
          cp pkg/ebpfinbound/capture_test.go ebpfinbound/capture_test.go
          cp pkg/ebpfinbound/oob_linux_test.go ebpfinbound/oob_linux_test.go
          cp control/bpf_bpfel.go ebpfinbound/bpf_bpfel.go
          cp control/bpf_bpfeb.go ebpfinbound/bpf_bpfeb.go
          cp control/bpf_bpfel.o ebpfinbound/bpf_bpfel.o
          cp control/bpf_bpfeb.o ebpfinbound/bpf_bpfeb.o
          sed -i 's/^package control$/package ebpfinbound/' ebpfinbound/bpf_bpfel.go ebpfinbound/bpf_bpfeb.go
          tar -xzf /tmp/ebpfinbound-module.tar.gz
          cp go.sum ebpfinbound/go.sum
          tar -czf /tmp/ebpfinbound-recovered.tar.gz ebpfinbound
      - name: Upload recovered module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebpfinbound-recovered
          path: |
            /tmp/ebpfinbound-module.tar.gz
            /tmp/ebpfinbound-module.sha256
            /tmp/ebpfinbound-recovered.tar.gz
          if-no-files-found: warn
          retention-days: 7
      - name: Validate candidate
        shell: bash
        run: |
          set -euxo pipefail
          cd ebpfinbound
          go mod tidy
          find . -name '*.go' -print0 | xargs -0 gofmt -w
          go test ./...
          go vet ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'forbidden daemon/policy dependency leaked into standalone module' >&2
            exit 1
          fi
