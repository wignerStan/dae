name: Generate eBPF inbound review fix

on:
  push:
    branches:
      - tmp/generate-ebpfinbound-review-fix-20260901

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-ebpfinbound-review-fix
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2
      - name: Reconstruct ordinary source candidate
        id: reconstruct
        shell: bash
        run: |
          set +e
          {
            set -x
            cat .github/ebpfinbound-review-fix/part-* > /tmp/ebpfinbound-source.b64
            base64 -d /tmp/ebpfinbound-source.b64 > /tmp/ebpfinbound-source.tar.gz
            status=$?
            if [ "$status" -eq 0 ]; then
              tar -tzf /tmp/ebpfinbound-source.tar.gz >/dev/null
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              rm -rf ebpfinbound
              tar -xzf /tmp/ebpfinbound-source.tar.gz
              status=$?
            fi
            echo "$status" > /tmp/reconstruct.status
            exit 0
          } > /tmp/reconstruct.log 2>&1
      - name: Generate bindings and module metadata
        id: generate
        if: always()
        shell: bash
        run: |
          set +e
          if [ "$(cat /tmp/reconstruct.status 2>/dev/null)" != 0 ] || [ ! -d ebpfinbound ]; then
            echo 98 > /tmp/generate.status
            echo 'source reconstruction failed; generation skipped' > /tmp/generate.log
            exit 0
          fi
          cd ebpfinbound
          sed -i 's/-type dae_param -type port_range -type tuples_key -type conn_state -type routing_handoff_entry/-type port_range -type tuples_key/' internal/generate.sh
          {
            set -x
            go generate ./...
            status=$?
            if [ "$status" -eq 0 ]; then go mod tidy; status=$?; fi
            if [ "$status" -eq 0 ]; then find . -name '*.go' -print0 | xargs -0 gofmt -w; status=$?; fi
            if [ "$status" -eq 0 ]; then test -s bpf_bpfel.o && test -s bpf_bpfeb.o; status=$?; fi
            echo "$status" > /tmp/generate.status
            exit 0
          } > /tmp/generate.log 2>&1
      - name: Package diagnostics and generated candidate
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test -f /tmp/reconstruct.status || echo 99 > /tmp/reconstruct.status
          test -f /tmp/generate.status || echo 99 > /tmp/generate.status
          if [ -d ebpfinbound ]; then
            tar -czf /tmp/ebpfinbound-generated.tar.gz ebpfinbound .github/workflows/ebpfinbound.yml
          else
            tar -czf /tmp/ebpfinbound-generated.tar.gz --files-from /dev/null
          fi
          sha256sum /tmp/ebpfinbound-generated.tar.gz > /tmp/ebpfinbound-generated.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebpfinbound-generated-review-fix
          path: |
            /tmp/ebpfinbound-generated.tar.gz
            /tmp/ebpfinbound-generated.sha256
            /tmp/reconstruct.log
            /tmp/reconstruct.status
            /tmp/generate.log
            /tmp/generate.status
          retention-days: 3
      - name: Require reconstruction and generation success
        run: |
          test "$(cat /tmp/reconstruct.status)" = 0
          test "$(cat /tmp/generate.status)" = 0
      - name: Validate module
        working-directory: ebpfinbound
        run: |
          set -euxo pipefail
          go test -race ./...
          go vet ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'daemon, policy, outbound, QUIC, or daemon logging dependency leaked into ebpfinbound' >&2
            exit 1
          fi
          go test -run TestCaptureSpecIsPruned .
          git diff --check
      - name: Publish ordinary one-commit branch and PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BASE=5db27a0028d36e7847bd3796497df952337a20e2
          TARGET=fix/ebpfinbound-one-shot-runtime
          tar -czf /tmp/provider-tree.tar.gz ebpfinbound
          cp .github/workflows/ebpfinbound.yml /tmp/ebpfinbound.yml
          git checkout -B final "$BASE"
          rm -rf ebpfinbound
          tar -xzf /tmp/provider-tree.tar.gz
          cp /tmp/ebpfinbound.yml .github/workflows/ebpfinbound.yml
          git config user.name Jacob
          git config user.email 240170694+wignerStan@users.noreply.github.com
          git add .github/workflows/ebpfinbound.yml ebpfinbound
          git add -f ebpfinbound/bpf_bpfel.go ebpfinbound/bpf_bpfel.o ebpfinbound/bpf_bpfeb.go ebpfinbound/bpf_bpfeb.o
          git diff --cached --check
          git commit -m 'feat(ebpfinbound): add one-shot standalone capture runtime'
          test "$(git rev-list --count "$BASE"..HEAD)" = 1
          git push --force origin HEAD:"$TARGET"
          if gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$TARGET" --repo "$GITHUB_REPOSITORY" --base main --title 'feat(ebpfinbound): add one-shot standalone capture runtime' --body-file - <<'EOF'
          ## Summary

          Adds a build-complete standalone eBPF transparent capture module at `github.com/wignerStan/dae/ebpfinbound`.

          - replaces cloned listener generations with a one-shot runtime-owned listener set
          - serializes metadata operations against close
          - rejects foreign namespace, link, and TC filter ownership
          - gates host sysctl mutation and restores only unchanged provider-applied values
          - resolves WAN `auto` and rejects accidental zero capture
          - prunes the loaded BPF collection to an explicit capture-only program/map allowlist
          - checks in `go.sum`, generated little/big-endian bindings, and BPF objects
          - adds race, ownership, restart, sysctl, and privileged lifecycle tests

          This module contains capture mechanics only. DNS, sniffing, routing, and outbound policy remain consumer-owned.
          EOF
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$TARGET" --title 'feat(ebpfinbound): add one-shot standalone capture runtime' --body-file - <<'EOF'
          ## Summary

          Adds a build-complete standalone eBPF transparent capture module at `github.com/wignerStan/dae/ebpfinbound`.

          - replaces cloned listener generations with a one-shot runtime-owned listener set
          - serializes metadata operations against close
          - rejects foreign namespace, link, and TC filter ownership
          - gates host sysctl mutation and restores only unchanged provider-applied values
          - resolves WAN `auto` and rejects accidental zero capture
          - prunes the loaded BPF collection to an explicit capture-only program/map allowlist
          - checks in `go.sum`, generated little/big-endian bindings, and BPF objects
          - adds race, ownership, restart, sysctl, and privileged lifecycle tests

          This module contains capture mechanics only. DNS, sniffing, routing, and outbound policy remain consumer-owned.
          EOF
          fi
