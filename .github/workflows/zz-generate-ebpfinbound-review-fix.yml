name: Generate eBPF inbound review fix

on:
  push:
    branches:
      - tmp/generate-ebpfinbound-review-fix-20260901

permissions:
  contents: read

concurrency:
  group: generate-ebpfinbound-review-fix
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2
      - name: Reconstruct ordinary source candidate
        id: reconstruct
        shell: bash
        run: |
          set +e
          {
            set -x
            find .github/ebpfinbound-review-fix -maxdepth 1 -type f -printf '%f %s\n' | sort
            wc -c .github/ebpfinbound-review-fix/part-*
            cat .github/ebpfinbound-review-fix/part-* > /tmp/ebpfinbound-source.b64
            base64 -d /tmp/ebpfinbound-source.b64 > /tmp/ebpfinbound-source.tar.gz
            status=$?
            if [ "$status" -eq 0 ]; then
              sha256sum /tmp/ebpfinbound-source.tar.gz
              tar -tzf /tmp/ebpfinbound-source.tar.gz
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              rm -rf ebpfinbound
              tar -xzf /tmp/ebpfinbound-source.tar.gz
              status=$?
            fi
            echo "$status" > /tmp/reconstruct.status
            exit 0
          } > /tmp/reconstruct.log 2>&1
      - name: Generate bindings and module metadata
        id: generate
        if: always()
        shell: bash
        run: |
          set +e
          if [ "$(cat /tmp/reconstruct.status 2>/dev/null)" != 0 ] || [ ! -d ebpfinbound ]; then
            echo 98 > /tmp/generate.status
            echo 'source reconstruction failed; generation skipped' > /tmp/generate.log
            exit 0
          fi
          cd ebpfinbound
          {
            set -x
            go generate ./...
            status=$?
            if [ "$status" -eq 0 ]; then
              go mod tidy
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              find . -name '*.go' -print0 | xargs -0 gofmt -w
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              test -s bpf_bpfel.o && test -s bpf_bpfeb.o
              status=$?
            fi
            echo "$status" > /tmp/generate.status
            exit 0
          } > /tmp/generate.log 2>&1
      - name: Package diagnostics and generated candidate
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test -f /tmp/reconstruct.status || echo 99 > /tmp/reconstruct.status
          test -f /tmp/reconstruct.log || true
          test -f /tmp/generate.status || echo 99 > /tmp/generate.status
          test -f /tmp/generate.log || true
          if [ -d ebpfinbound ]; then
            tar -czf /tmp/ebpfinbound-generated.tar.gz ebpfinbound .github/workflows/ebpfinbound.yml
          else
            tar -czf /tmp/ebpfinbound-generated.tar.gz --files-from /dev/null
          fi
          sha256sum /tmp/ebpfinbound-generated.tar.gz > /tmp/ebpfinbound-generated.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebpfinbound-generated-review-fix
          path: |
            /tmp/ebpfinbound-generated.tar.gz
            /tmp/ebpfinbound-generated.sha256
            /tmp/reconstruct.log
            /tmp/reconstruct.status
            /tmp/generate.log
            /tmp/generate.status
          retention-days: 3
      - name: Require reconstruction and generation success
        run: |
          test "$(cat /tmp/reconstruct.status)" = 0
          test "$(cat /tmp/generate.status)" = 0
      - name: Validate module
        working-directory: ebpfinbound
        run: |
          set -euxo pipefail
          go test -race ./...
          go vet ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'daemon, policy, outbound, QUIC, or daemon logging dependency leaked into ebpfinbound' >&2
            exit 1
          fi
          go test -run TestCaptureSpecIsPruned .
          git diff --check
