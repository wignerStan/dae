name: Generate eBPF inbound review fix

on:
  push:
    branches:
      - tmp/generate-ebpfinbound-review-fix-20260901

permissions:
  contents: write

concurrency:
  group: generate-ebpfinbound-review-fix
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2
      - name: Reconstruct ordinary source candidate
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/ebpfinbound-review-fix/part-* | base64 -d > /tmp/ebpfinbound-source.tar.gz
          tar -tzf /tmp/ebpfinbound-source.tar.gz >/dev/null
          rm -rf ebpfinbound
          tar -xzf /tmp/ebpfinbound-source.tar.gz
      - name: Generate bindings and module metadata
        working-directory: ebpfinbound
        run: |
          set -euxo pipefail
          sed -i 's/-type dae_param -type port_range -type tuples_key -type conn_state -type routing_handoff_entry/-type port_range -type tuples_key/' internal/generate.sh
          go generate ./...
          go mod tidy
          find . -name '*.go' -print0 | xargs -0 gofmt -w
          test -s bpf_bpfel.o
          test -s bpf_bpfeb.o
      - name: Validate module
        working-directory: ebpfinbound
        run: |
          set -euxo pipefail
          go test -race ./...
          go vet ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'daemon, policy, outbound, QUIC, or daemon logging dependency leaked into ebpfinbound' >&2
            exit 1
          fi
          go test -run TestCaptureSpecIsPruned .
          git diff --check
      - name: Publish ordinary source branch
        id: publish
        shell: bash
        run: |
          set +e
          {
            set -x
            BASE=5db27a0028d36e7847bd3796497df952337a20e2
            TARGET=fix/ebpfinbound-one-shot-runtime
            tar -czf /tmp/provider-tree.tar.gz ebpfinbound
            cp .github/workflows/ebpfinbound.yml /tmp/ebpfinbound.yml
            rm -rf /tmp/provider-final
            git worktree add --detach /tmp/provider-final "$BASE"
            cd /tmp/provider-final
            tar -xzf /tmp/provider-tree.tar.gz
            cp /tmp/ebpfinbound.yml .github/workflows/ebpfinbound.yml
            git config user.name Jacob
            git config user.email 240170694+wignerStan@users.noreply.github.com
            git add .github/workflows/ebpfinbound.yml ebpfinbound
            git add -f ebpfinbound/bpf_bpfel.go ebpfinbound/bpf_bpfel.o ebpfinbound/bpf_bpfeb.go ebpfinbound/bpf_bpfeb.o
            git diff --cached --check
            git commit -m 'feat(ebpfinbound): add one-shot standalone capture runtime'
            test "$(git rev-list --count "$BASE"..HEAD)" = 1
            git push --force origin HEAD:"$TARGET"
            status=$?
            echo "$status" > /tmp/publish.status
            exit 0
          } > /tmp/publish.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebpfinbound-review-fix-publication
          path: |
            /tmp/publish.log
            /tmp/publish.status
          retention-days: 3
      - name: Require publication success
        run: test "$(cat /tmp/publish.status)" = 0
