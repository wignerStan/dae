name: Build Schema-v9 eBPF inbound candidate

on:
  push:
    branches:
      - tmp/build-ebpfinbound-schema-v9-20260906-v1

permissions:
  contents: write

concurrency:
  group: build-ebpfinbound-schema-v9-20260906-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/build-ebpfinbound-schema-v9-20260906-v1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Execute validated builder template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path('.github/ci/zz-build-ebpfinbound-schema-v9.template.yml').read_text()
          template = template.replace(
              'qdisc, qdiscCreated, err := ensureClsact(link)',
              '_, qdiscCreated, err := ensureClsact(link)',
          )
          template = template.replace(
              '''          git add \\
            control/kern/tproxy.c \\
            ebpfinbound \\
            .github/workflows/ebpfinbound.yml''',
              '''          git add \\
            control/kern/tproxy.c \\
            ebpfinbound''',
          )

          lines = template.splitlines()
          blocks = []
          index = 0
          marker = '        run: |'
          while index < len(lines):
              if lines[index] != marker:
                  index += 1
                  continue
              index += 1
              block = []
              while index < len(lines):
                  line = lines[index]
                  if line.startswith('          '):
                      block.append(line[10:])
                      index += 1
                      continue
                  if line == '':
                      block.append('')
                      index += 1
                      continue
                  break
              blocks.append('\n'.join(block))

          if len(blocks) != 6:
              raise SystemExit(f'unexpected builder run-block count: {len(blocks)}')
          script = '#!/usr/bin/env bash\nset -euo pipefail\n\n' + '\n\n'.join(blocks) + '\n'
          path = Path('/tmp/run-ebpfinbound-builder.sh')
          path.write_text(script)
          path.chmod(0o700)
          PY
          /tmp/run-ebpfinbound-builder.sh
