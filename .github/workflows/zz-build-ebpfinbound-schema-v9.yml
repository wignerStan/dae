name: Build Schema-v9 eBPF inbound candidate

on:
  push:
    branches:
      - tmp/build-ebpfinbound-schema-v9-20260906-v1

permissions:
  contents: write

concurrency:
  group: build-ebpfinbound-schema-v9-20260906-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/build-ebpfinbound-schema-v9-20260906-v1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Execute validated builder template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path('.github/ci/zz-build-ebpfinbound-schema-v9.template.yml').read_text()
          template = template.replace(
              'qdisc, qdiscCreated, err := ensureClsact(link)',
              '_, qdiscCreated, err := ensureClsact(link)',
          )
          template = template.replace(
              '''          git add \\
            control/kern/tproxy.c \\
            ebpfinbound \\
            .github/workflows/ebpfinbound.yml''',
              '''          git add \\
            control/kern/tproxy.c \\
            ebpfinbound''',
          )

          lines = template.splitlines()
          blocks = []
          index = 0
          marker = '        run: |'
          while index < len(lines):
              if lines[index] != marker:
                  index += 1
                  continue
              index += 1
              block = []
              while index < len(lines):
                  line = lines[index]
                  if line.startswith('          '):
                      block.append(line[10:])
                      index += 1
                      continue
                  if line == '':
                      block.append('')
                      index += 1
                      continue
                  break
              blocks.append('\n'.join(block))

          if len(blocks) != 6:
              raise SystemExit(f'unexpected builder run-block count: {len(blocks)}')

          capture_patch = r'''python3 - <<'INNER_PY'
          from pathlib import Path

          source = Path('/tmp/dae-ebpfinbound-final')
          path = source / 'control/kern/tproxy.c'
          text = path.read_text()
          function_open = """static __noinline bool
          wan_outbound_is_alive(struct __sk_buff *skb, __u8 outbound, __u8 l4proto,
          \t\t      __be16 dport)
          {"""
          capture_open = function_open + """
          #ifdef DAE_CAPTURE_ONLY
          \t(void)skb;
          \t(void)outbound;
          \t(void)l4proto;
          \t(void)dport;
          \treturn true;
          #else"""
          if text.count(function_open) != 1:
              raise SystemExit('unexpected outbound connectivity helper count')
          text = text.replace(function_open, capture_open, 1)
          function_close = """\treturn true;
          }

          static __noinline int
          do_tproxy_wan_egress_tcp"""
          capture_close = """\treturn true;
          #endif
          }

          static __noinline int
          do_tproxy_wan_egress_tcp"""
          if text.count(function_close) != 1:
              raise SystemExit('outbound connectivity helper end not found')
          path.write_text(text.replace(function_close, capture_close, 1))

          (source / 'ebpfinbound/cgroup_stub.go').write_text('''//go:build linux && dae_stub_ebpf

// SPDX-License-Identifier: AGPL-3.0-only

package ebpfinbound

import (
    "bufio"
    "errors"
    "os"
    "strings"
)

func detectCgroupPath() (string, error) {
    file, err := os.Open("/proc/mounts")
    if err != nil {
        return "", err
    }
    defer file.Close()
    scanner := bufio.NewScanner(file)
    for scanner.Scan() {
        fields := strings.Fields(scanner.Text())
        if len(fields) >= 3 && fields[2] == "cgroup2" {
            return strings.NewReplacer(`\\040`, " ", `\\011`, "\\t", `\\134`, `\\`).Replace(fields[1]), nil
        }
    }
    if err := scanner.Err(); err != nil {
        return "", err
    }
    return "", errors.New("cgroup v2 mount not found")
}
''')
          INNER_PY'''

          script = (
              '#!/usr/bin/env bash\nset -euo pipefail\n\n'
              + blocks[0]
              + '\n\n'
              + blocks[1]
              + '\n\n'
              + capture_patch
              + '\n\n'
              + '\n\n'.join(blocks[2:])
              + '\n'
          )
          path = Path('/tmp/run-ebpfinbound-builder.sh')
          path.write_text(script)
          path.chmod(0o700)
          PY
          /tmp/run-ebpfinbound-builder.sh
