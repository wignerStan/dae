name: Export source workspace

on:
  push:
    branches:
      - refactor/ebpf-inbound-module

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare source archive
        run: |
          tar --exclude=.git -czf /tmp/dae-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dae-source
          path: /tmp/dae-source.tar.gz
          if-no-files-found: error
          retention-days: 1
