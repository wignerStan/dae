name: Export Go toolchain for local validation

on:
  push:
    branches:
      - tmp/export-go-toolchain-20260901

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false
      - name: Package toolchain
        shell: bash
        run: |
          set -euo pipefail
          GOROOT=$(go env GOROOT)
          tar -C "$(dirname "$GOROOT")" -czf /tmp/go-1.26.0-linux-amd64.tar.gz "$(basename "$GOROOT")"
          sha256sum /tmp/go-1.26.0-linux-amd64.tar.gz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: go-1.26.0-linux-amd64
          path: |
            /tmp/go-1.26.0-linux-amd64.tar.gz
            /tmp/SHA256SUMS
          retention-days: 1
