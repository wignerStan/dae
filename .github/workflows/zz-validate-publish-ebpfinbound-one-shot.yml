name: Validate and publish one-shot eBPF inbound

on:
  push:
    branches:
      - tmp/validate-ebpfinbound-one-shot-20260901

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate-ebpfinbound-one-shot
  cancel-in-progress: true

jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/validate-ebpfinbound-one-shot-20260901
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Install eBPF test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2
      - name: Finalize review hardening source and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > ebpfinbound/oob_linux.go <<'EOF'
          //go:build linux

          // SPDX-License-Identifier: AGPL-3.0-only

          package ebpfinbound

          import (
          	"encoding/binary"
          	"net"
          	"net/netip"

          	"golang.org/x/sys/unix"
          )

          // OriginalDestination extracts IP_ORIGDSTADDR/IPV6_ORIGDSTADDR from
          // a UDP control-message buffer. Missing or malformed metadata returns
          // the zero AddrPort.
          func OriginalDestination(oob []byte) netip.AddrPort {
          	messages, err := unix.ParseSocketControlMessage(oob)
          	if err != nil {
          		return netip.AddrPort{}
          	}
          	for _, message := range messages {
          		switch {
          		case message.Header.Level == unix.SOL_IP && message.Header.Type == unix.IP_ORIGDSTADDR:
          			if len(message.Data) < unix.SizeofSockaddrInet4 || binary.NativeEndian.Uint16(message.Data[:2]) != unix.AF_INET {
          				continue
          			}
          			return netip.AddrPortFrom(netip.AddrFrom4([4]byte(message.Data[4:8])), binary.BigEndian.Uint16(message.Data[2:4]))
          		case message.Header.Level == unix.SOL_IPV6 && message.Header.Type == unix.IPV6_ORIGDSTADDR:
          			if len(message.Data) < unix.SizeofSockaddrInet6 || binary.NativeEndian.Uint16(message.Data[:2]) != unix.AF_INET6 {
          				continue
          			}
          			var raw [16]byte
          			copy(raw[:], message.Data[8:24])
          			address := netip.AddrFrom16(raw)
          			if scope := binary.NativeEndian.Uint32(message.Data[24:28]); scope != 0 {
          				if iface, lookupErr := net.InterfaceByIndex(int(scope)); lookupErr == nil {
          					address = address.WithZone(iface.Name)
          				}
          			}
          			return netip.AddrPortFrom(address, binary.BigEndian.Uint16(message.Data[2:4]))
          		}
          	}
          	return netip.AddrPort{}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('ebpfinbound/attach_linux.go')
          text = path.read_text()
          text = text.replace('"os"\n\t"sort"', '"os"\n\t"runtime"\n\t"sort"', 1)
          old = '''\tcleanupQdisc := func() error {
          \t\tif !qdiscCreated || !interfaceFiltersEmpty(link) {
          \t\t\treturn nil
          \t\t}
          \t\tif err := netlink.QdiscDel(qdisc); err != nil && !isMissingNetlinkError(err) {
          \t\t\treturn fmt.Errorf("delete owned clsact qdisc on %s: %w", link.Attrs().Name, err)
          \t\t}
          \t\treturn nil
          \t}'''
          new = old + '''
          \tif inNetNS {
          \t\trawCleanup := cleanupQdisc
          \t\tcleanupQdisc = func() error { return withNamedNetNS(captureNetNSName, rawCleanup) }
          \t}'''
          if old not in text:
              raise SystemExit('qdisc cleanup marker missing')
          text = text.replace(old, new, 1)
          old_ns = '''func withNamedNetNS(name string, function func() error) (err error) {
          \thost, err := netns.Get()'''
          new_ns = '''func withNamedNetNS(name string, function func() error) (err error) {
          \truntime.LockOSThread()
          \tdefer runtime.UnlockOSThread()
          \thost, err := netns.Get()'''
          if old_ns not in text:
              raise SystemExit('network namespace helper marker missing')
          text = text.replace(old_ns, new_ns, 1)
          path.write_text(text)

          path = Path('ebpfinbound/preflight_linux.go')
          text = path.read_text()
          marker = '''\tchecks := map[string]string{
          \t\t"/proc/sys/net/ipv4/ip_forward": "1",
          \t\t"/proc/sys/net/ipv6/conf/all/forwarding": "1",
          \t}'''
          replacement = '''\tchecks := map[string]string{
          \t\t"/proc/sys/net/ipv4/conf/all/rp_filter": "0",
          \t\t"/proc/sys/net/ipv4/conf/all/arp_filter": "0",
          \t\t"/proc/sys/net/ipv4/ip_forward": "1",
          \t\t"/proc/sys/net/ipv6/conf/all/forwarding": "1",
          \t}'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

          cat > ebpfinbound/api_test.go <<'EOF'
          package ebpfinbound

          import (
          	"net/netip"
          	"testing"
          	"time"
          )

          func TestFlowValidate(t *testing.T) {
          	flow := Flow{Network: NetworkTCP, Source: netip.MustParseAddrPort("192.0.2.1:1000"), Destination: netip.MustParseAddrPort("198.51.100.2:443")}
          	if err := flow.Validate(); err != nil { t.Fatal(err) }
          	flow.Network = "invalid"
          	if err := flow.Validate(); err == nil { t.Fatal("expected invalid network error") }
          }

          func TestOperationGateWaitsForInflightOperation(t *testing.T) {
          	var gate operationGate
          	gate.init()
          	if err := gate.enter(); err != nil { t.Fatal(err) }
          	done := make(chan struct{})
          	go func() { gate.closeAndWait(); close(done) }()
          	select { case <-done: t.Fatal("close passed active operation"); case <-time.After(20 * time.Millisecond): }
          	gate.leave()
          	select { case <-done: case <-time.After(time.Second): t.Fatal("close did not finish") }
          	if err := gate.enter(); err == nil { t.Fatal("operation entered closing gate") }
          }
          EOF

          cat > ebpfinbound/preflight_linux_test.go <<'EOF'
          //go:build linux

          package ebpfinbound

          import (
          	"reflect"
          	"testing"
          )

          func TestResolveInterfacePatterns(t *testing.T) {
          	got, err := resolveInterfacePatterns([]string{"eth*", "eth0"}, []string{"eth1", "eth0", "lo"}, nil)
          	if err != nil { t.Fatal(err) }
          	want := []string{"eth0", "eth1"}
          	if !reflect.DeepEqual(got, want) { t.Fatalf("got %v want %v", got, want) }
          }

          func TestResolveWANAuto(t *testing.T) {
          	got, err := resolveInterfacePatterns([]string{"auto"}, []string{"eth0"}, []string{"eth0"})
          	if err != nil { t.Fatal(err) }
          	if !reflect.DeepEqual(got, []string{"eth0"}) { t.Fatalf("got %v", got) }
          	if _, err := resolveInterfacePatterns([]string{"auto"}, []string{"eth0"}, nil); err == nil { t.Fatal("LAN auto must fail") }
          }

          func TestUnmatchedSelectorFails(t *testing.T) {
          	if _, err := resolveInterfacePatterns([]string{"missing*"}, []string{"eth0"}, nil); err == nil { t.Fatal("expected zero-match error") }
          }
          EOF

          cat > ebpfinbound/sysctl_linux_test.go <<'EOF'
          //go:build linux

          package ebpfinbound

          import (
          	"errors"
          	"os"
          	"testing"
          )

          func fakeSysctlManager(values map[string]string) *sysctlManager {
          	m := newSysctlManager(nil)
          	m.readFile = func(path string) ([]byte, error) {
          		value, ok := values[path]
          		if !ok { return nil, os.ErrNotExist }
          		return []byte(value), nil
          	}
          	m.writeFile = func(path string, value []byte, _ os.FileMode) error { values[path] = string(value); return nil }
          	return m
          }

          func TestSysctlRestoresOnlyUnchangedAppliedValue(t *testing.T) {
          	const path = "/proc/sys/net/test/value"
          	values := map[string]string{path: "0"}
          	m := fakeSysctlManager(values)
          	if err := m.Set(path, "1"); err != nil { t.Fatal(err) }
          	values[path] = "2"
          	if err := m.Close(); err != nil { t.Fatal(err) }
          	if values[path] != "2" { t.Fatalf("administrator value overwritten: %q", values[path]) }
          	if err := m.Set(path, "3"); err == nil { t.Fatal("closed manager accepted Set") }
          }

          func TestSysctlRestoresAppliedValue(t *testing.T) {
          	const path = "/proc/sys/net/test/value"
          	values := map[string]string{path: "0"}
          	m := fakeSysctlManager(values)
          	if err := m.Set(path, "1"); err != nil { t.Fatal(err) }
          	if err := m.Close(); err != nil { t.Fatal(err) }
          	if values[path] != "0" { t.Fatalf("value not restored: %q", values[path]) }
          	if err := m.Close(); err != nil && !errors.Is(err, os.ErrClosed) { t.Fatal(err) }
          }
          EOF

          cat > ebpfinbound/process_linux_test.go <<'EOF'
          //go:build linux

          package ebpfinbound

          import (
          	"strings"
          	"testing"
          )

          func TestParseProcessStartTimeWithSpaces(t *testing.T) {
          	fields := make([]string, 20)
          	for index := range fields { fields[index] = "1" }
          	fields[0] = "S"
          	fields[19] = "987654"
          	value, err := parseProcessStartTime("123 (name with spaces) " + strings.Join(fields, " "))
          	if err != nil { t.Fatal(err) }
          	if value != 987654 { t.Fatalf("start time = %d", value) }
          }

          func TestTaskCommTruncation(t *testing.T) {
          	if got := truncateTaskComm("12345678901234567890"); got != "123456789012345" { t.Fatalf("got %q", got) }
          }
          EOF

          cat > ebpfinbound/bpf_linux_test.go <<'EOF'
          //go:build linux && !dae_stub_ebpf

          package ebpfinbound

          import (
          	"slices"
          	"testing"
          )

          func TestCaptureSpecPrunesPolicy(t *testing.T) {
          	spec, err := loadBpf()
          	if err != nil { t.Fatal(err) }
          	if err := pruneCaptureSpec(spec); err != nil { t.Fatal(err) }
          	programs, maps := captureSpecNames(spec)
          	for _, name := range captureProgramNames {
          		if !slices.Contains(programs, name) { t.Fatalf("missing program %s", name) }
          	}
          	for _, name := range forbiddenPolicyMaps {
          		if slices.Contains(maps, name) { t.Fatalf("policy map leaked: %s", name) }
          	}
          }
          EOF

          cat > ebpfinbound/runtime_integration_test.go <<'EOF'
          //go:build linux && integration && !dae_stub_ebpf

          package ebpfinbound

          import (
          	"context"
          	"errors"
          	"fmt"
          	"net"
          	"net/netip"
          	"os"
          	"runtime"
          	"testing"
          	"time"

          	"github.com/vishvananda/netlink"
          	"github.com/vishvananda/netns"
          )

          func TestPrivilegedCaptureLifecycleAndTraffic(t *testing.T) {
          	if os.Geteuid() != 0 { t.Skip("root required") }
          	_ = CleanupStale(context.Background())
          	clientNS, hostName, cleanup := createTestClientNetwork(t)
          	defer cleanup()
          	config := CaptureConfig{LANInterfaces: []string{hostName}, TProxyPort: 23456, OutputMark: 0x102, AutoConfigureKernel: true}
          	for iteration := 0; iteration < 2; iteration++ {
          		runtimeValue, err := New(context.Background(), Options{Capture: config})
          		if err != nil { t.Fatal(err) }
          		if !runtimeValue.Status().Ready { t.Fatal("runtime not ready") }
          		if iteration == 0 { exerciseCapturedTCP(t, runtimeValue.Listeners().TCP4(), clientNS); exerciseCapturedUDP(t, runtimeValue.Listeners().UDP(), clientNS) }
          		if err := runtimeValue.Close(); err != nil { t.Fatal(err) }
          		if runtimeValue.Status().Ready { t.Fatal("runtime remained ready after close") }
          		if _, err := netlink.LinkByName(captureHostLink); err == nil { t.Fatal("capture link leaked") }
          		if _, err := netns.GetFromName(captureNetNSName); err == nil { t.Fatal("capture namespace leaked") }
          	}
          }

          func exerciseCapturedTCP(t *testing.T, listener net.Listener, clientNS netns.NsHandle) {
          	t.Helper()
          	tcp, ok := listener.(*net.TCPListener); if !ok { t.Fatalf("unexpected listener %T", listener) }
          	_ = tcp.SetDeadline(time.Now().Add(10 * time.Second))
          	clientResult := make(chan error, 1)
          	go func() { clientResult <- withTestNetNS(clientNS, func() error { conn, err := net.DialTimeout("tcp4", "203.0.113.10:443", 8*time.Second); if err != nil { return err }; defer conn.Close(); _, err = conn.Write([]byte("ping")); return err }) }()
          	conn, err := listener.Accept(); if err != nil { t.Fatal(err) }; defer conn.Close()
          	if local, ok := conn.LocalAddr().(*net.TCPAddr); !ok || local.Port != 443 { t.Fatalf("original TCP destination = %v", conn.LocalAddr()) }
          	buffer := make([]byte, 4); _ = conn.SetReadDeadline(time.Now().Add(5*time.Second)); if _, err := conn.Read(buffer); err != nil { t.Fatal(err) }
          	if string(buffer) != "ping" { t.Fatalf("payload %q", buffer) }
          	if err := <-clientResult; err != nil { t.Fatal(err) }
          }

          func exerciseCapturedUDP(t *testing.T, listener *net.UDPConn, clientNS netns.NsHandle) {
          	t.Helper(); _ = listener.SetReadDeadline(time.Now().Add(10*time.Second))
          	clientResult := make(chan error, 1)
          	go func() { clientResult <- withTestNetNS(clientNS, func() error { conn, err := net.DialUDP("udp4", nil, net.UDPAddrFromAddrPort(netip.MustParseAddrPort("203.0.113.20:5353"))); if err != nil { return err }; defer conn.Close(); _, err = conn.Write([]byte("udp")); return err }) }()
          	payload := make([]byte, 64); oob := make([]byte, 512)
          	n, oobN, flags, _, err := listener.ReadMsgUDPAddrPort(payload, oob); if err != nil { t.Fatal(err) }
          	if flags != 0 { t.Fatalf("UDP flags %#x", flags) }
          	if string(payload[:n]) != "udp" { t.Fatalf("UDP payload %q", payload[:n]) }
          	destination := OriginalDestination(oob[:oobN]); if !destination.IsValid() || destination.Port() != 5353 { t.Fatalf("original UDP destination %v", destination) }
          	if err := <-clientResult; err != nil { t.Fatal(err) }
          }

          func createTestClientNetwork(t *testing.T) (netns.NsHandle, string, func()) {
          	t.Helper(); runtime.LockOSThread()
          	hostNS, err := netns.Get(); if err != nil { runtime.UnlockOSThread(); t.Fatal(err) }
          	name := fmt.Sprintf("dae-ebpf-test-%d", os.Getpid()); _ = netns.DeleteNamed(name)
          	clientNS, err := netns.NewNamed(name); if err != nil { hostNS.Close(); runtime.UnlockOSThread(); t.Fatal(err) }
          	if err := netns.Set(hostNS); err != nil { t.Fatal(err) }
          	hostName, peerName := "dae-test0", "dae-test1"; if old, err := netlink.LinkByName(hostName); err == nil { _ = netlink.LinkDel(old) }
          	veth := &netlink.Veth{LinkAttrs: netlink.LinkAttrs{Name: hostName}, PeerName: peerName}
          	if err := netlink.LinkAdd(veth); err != nil { t.Fatal(err) }
          	hostLink, err := netlink.LinkByName(hostName); if err != nil { t.Fatal(err) }
          	if err := netlink.AddrAdd(hostLink, &netlink.Addr{IPNet: mustCIDR("198.18.0.1/24")}); err != nil { t.Fatal(err) }
          	if err := netlink.LinkSetUp(hostLink); err != nil { t.Fatal(err) }
          	peer, err := netlink.LinkByName(peerName); if err != nil { t.Fatal(err) }
          	if err := netlink.LinkSetNsFd(peer, int(clientNS)); err != nil { t.Fatal(err) }
          	if err := netns.Set(clientNS); err != nil { t.Fatal(err) }
          	peer, err = netlink.LinkByName(peerName); if err != nil { t.Fatal(err) }
          	if err := netlink.AddrAdd(peer, &netlink.Addr{IPNet: mustCIDR("198.18.0.2/24")}); err != nil { t.Fatal(err) }
          	if err := netlink.LinkSetUp(peer); err != nil { t.Fatal(err) }
          	loopback, _ := netlink.LinkByName("lo"); _ = netlink.LinkSetUp(loopback)
          	if err := netlink.RouteAdd(&netlink.Route{LinkIndex: peer.Attrs().Index, Gw: net.ParseIP("198.18.0.1")}); err != nil { t.Fatal(err) }
          	if err := netns.Set(hostNS); err != nil { t.Fatal(err) }
          	runtime.UnlockOSThread()
          	cleanup := func() { runtime.LockOSThread(); defer runtime.UnlockOSThread(); _ = netns.Set(hostNS); if link, err := netlink.LinkByName(hostName); err == nil { _ = netlink.LinkDel(link) }; _ = netns.DeleteNamed(name); _ = clientNS.Close(); _ = hostNS.Close() }
          	return clientNS, hostName, cleanup
          }

          func withTestNetNS(target netns.NsHandle, function func() error) (err error) {
          	runtime.LockOSThread(); defer runtime.UnlockOSThread(); host, err := netns.Get(); if err != nil { return err }; defer host.Close(); if err := netns.Set(target); err != nil { return err }; defer func(){ err = errors.Join(err, netns.Set(host)) }(); return function()
          }
          func mustCIDR(raw string) *net.IPNet { ip, network, err := net.ParseCIDR(raw); if err != nil { panic(err) }; network.IP = ip; return network }
          EOF

          gofmt -w ebpfinbound
      - name: Generate BPF bindings and module sums
        shell: bash
        run: |
          set -euxo pipefail
          cd ebpfinbound
          go generate ./...
          go mod tidy
          gofmt -w .
      - name: Unit, race, vet and dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          cd ebpfinbound
          go test -race ./...
          go vet ./...
          go test -tags dae_stub_ebpf ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'forbidden daemon, policy, outbound, QUIC, qpack, or logging dependency leaked into standalone module' >&2
            exit 1
          fi
          go build ./cmd/dae-ebpf-tool
          ! grep -R 'CloneGeneration\|CommitGeneration\|OpenGeneration' --include='*.go' .
      - name: Generated BPF freshness
        shell: bash
        run: |
          set -euxo pipefail
          cd ebpfinbound
          sha256sum bpf_bpfel.go bpf_bpfel.o bpf_bpfeb.go bpf_bpfeb.o > /tmp/bpf-before
          go generate ./...
          sha256sum -c /tmp/bpf-before
          git diff --check
      - name: Privileged real traffic and restart lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /run/netns
          cd ebpfinbound
          sudo --preserve-env=PATH env HOME="$HOME" go test -tags=integration -run TestPrivilegedCaptureLifecycleAndTraffic -count=1 -v .
          ! ip link show dae-ebpf0
          ! ip netns list | grep -q '^dae-ebpf-inbound'
      - name: Create normal provider workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ebpfinbound.yml <<'EOF'
          name: eBPF Inbound

          on:
            pull_request:
              paths:
                - 'ebpfinbound/**'
                - 'control/kern/**'
                - '.gitmodules'
                - '.github/workflows/ebpfinbound.yml'
            push:
              branches: [main]
              paths:
                - 'ebpfinbound/**'
                - 'control/kern/**'
                - '.gitmodules'
                - '.github/workflows/ebpfinbound.yml'

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v6
                  with:
                    submodules: recursive
                - uses: actions/setup-go@v6
                  with:
                    go-version: 1.26.7
                - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev iproute2
                - name: Unit, race, vet and boundary
                  working-directory: ebpfinbound
                  run: |
                    go test -race ./...
                    go vet ./...
                    go test -tags dae_stub_ebpf ./...
                    deps=$(go list -deps ./...)
                    ! grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"
                - name: Generated BPF freshness
                  working-directory: ebpfinbound
                  run: |
                    sha256sum bpf_bpfel.go bpf_bpfel.o bpf_bpfeb.go bpf_bpfeb.o > /tmp/bpf-before
                    go generate ./...
                    sha256sum -c /tmp/bpf-before
                    git diff --exit-code
                - name: Privileged real traffic and restart lifecycle
                  working-directory: ebpfinbound
                  run: |
                    sudo mkdir -p /run/netns
                    sudo --preserve-env=PATH env HOME="$HOME" go test -tags=integration -run TestPrivilegedCaptureLifecycleAndTraffic -count=1 -v .
                    ! ip link show dae-ebpf0
                    ! ip netns list | grep -q '^dae-ebpf-inbound'
          EOF
      - name: Publish one ordinary source commit and open PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BASE=5db27a0028d36e7847bd3796497df952337a20e2
          cp -a ebpfinbound /tmp/ebpfinbound-final
          git reset --hard "$BASE"
          git clean -ffd
          cp -a /tmp/ebpfinbound-final ebpfinbound
          mkdir -p .github/workflows
          cp /tmp/ebpfinbound.yml .github/workflows/ebpfinbound.yml
          git add -f ebpfinbound .github/workflows/ebpfinbound.yml
          git diff --cached --check
          git config user.name Jacob
          git config user.email 240170694+wignerStan@users.noreply.github.com
          git commit -m 'refactor(ebpfinbound): add one-shot capture runtime'
          git push --force origin HEAD:refs/heads/fix/ebpfinbound-one-shot-runtime
          if gh pr view fix/ebpfinbound-one-shot-runtime --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit fix/ebpfinbound-one-shot-runtime --repo "$GITHUB_REPOSITORY" --base main --title 'refactor(ebpfinbound): add one-shot capture runtime'
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head fix/ebpfinbound-one-shot-runtime --title 'refactor(ebpfinbound): add one-shot capture runtime' --body 'Extracts a standalone policy-neutral dae capture runtime. Listener generations and duplicated receive queues are removed; startup is one-shot and returns only after listener publication plus synchronous TC/cgroup attachment. The runtime serializes map operations against close, rejects foreign host resources and TC filters, conditionally restores sysctls, validates PID start time, prunes policy maps, and includes privileged TCP/UDP interception plus restart tests.'
          fi
