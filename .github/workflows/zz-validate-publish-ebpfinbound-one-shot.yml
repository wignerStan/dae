name: Validate and materialize one-shot eBPF inbound

on:
  push:
    branches:
      - tmp/validate-ebpfinbound-one-shot-20260901

permissions:
  contents: write

concurrency:
  group: validate-ebpfinbound-one-shot
  cancel-in-progress: true

jobs:
  validate-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/validate-ebpfinbound-one-shot-20260901
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: false
      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2
      - name: Canonicalize capture-only source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('control/kern/tproxy.c')
          text = path.read_text()

          route_signature = """static __noinline __s64 route(const __u32 *flag, const void *l4hdr,
          \t\t\t      const __be32 *saddr, const __be32 *daddr,
          \t\t\t      const __be32 *mac)
          {"""
          if "Routing policy is owned by the embedding userspace engine." not in text:
              route_seam = route_signature + """
          #ifdef DAE_CAPTURE_ONLY
          \t/* Routing policy is owned by the embedding userspace engine. */
          \treturn (__s64)OUTBOUND_CONTROL_PLANE_ROUTING;
          #endif"""
              if text.count(route_signature) != 1:
                  raise SystemExit('route function marker not found exactly once')
              text = text.replace(route_signature, route_seam, 1)

          helper_open = """static __noinline bool
          wan_outbound_is_alive(struct __sk_buff *skb, __u8 outbound, __u8 l4proto,
          \t\t      __be16 dport)
          {"""
          if "(void)outbound;" not in text:
              capture_open = helper_open + """
          #ifdef DAE_CAPTURE_ONLY
          \t(void)skb;
          \t(void)outbound;
          \t(void)l4proto;
          \t(void)dport;
          \treturn true;
          #else"""
              if text.count(helper_open) != 1:
                  raise SystemExit('connectivity helper marker not found exactly once')
              text = text.replace(helper_open, capture_open, 1)
              helper_close = """\treturn true;
          }

          static __noinline int
          do_tproxy_wan_egress_tcp"""
              capture_close = """\treturn true;
          #endif
          }

          static __noinline int
          do_tproxy_wan_egress_tcp"""
              if text.count(helper_close) != 1:
                  raise SystemExit('connectivity helper end not found exactly once')
              text = text.replace(helper_close, capture_close, 1)
          path.write_text(text)

          attach = Path('ebpfinbound/attach_linux.go')
          attach_text = attach.read_text()
          old = 'func findTCFilter(link netlink.Link, parent, handle uint32) (netlink.Filter, error) {'
          new = 'func findTCFilter(link netlink.Link, parent, handle uint32, _ ...uint16) (netlink.Filter, error) {'
          if old in attach_text:
              attach_text = attach_text.replace(old, new, 1)
          elif new not in attach_text:
              raise SystemExit('findTCFilter signature not found')
          attach.write_text(attach_text)

          Path('ebpfinbound/zz_generate_fix.go').unlink(missing_ok=True)
          Path('ebpfinbound/internal/fix_tc_helper.py').unlink(missing_ok=True)
          PY
          gofmt -w ebpfinbound
          git diff --check
      - name: Generate BPF bindings and module sums
        shell: bash
        run: |
          set -euxo pipefail
          cd ebpfinbound
          go generate ./...
          go mod tidy
          gofmt -w .
          git diff --check
      - name: Unit race vet stub build and dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          cd ebpfinbound
          go test -race ./...
          go vet ./...
          go test -tags dae_stub_ebpf ./...
          go build ./...
          deps=$(go list -deps ./...)
          if grep -E 'github.com/daeuniverse/dae/(control|config|common|component|cmd|pkg)|github.com/daeuniverse/outbound|github.com/olicesx/quic-go|github.com/quic-go/qpack|github.com/sirupsen/logrus' <<<"$deps"; then
            echo 'policy, daemon, outbound, QUIC, qpack, or legacy logging dependency leaked into capture provider' >&2
            exit 1
          fi
          ! grep -R 'OpenGeneration\|CloneGeneration\|CommitGeneration' --include='*.go' .
      - name: Privileged real TCP UDP and restart lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /run/netns
          cd ebpfinbound
          sudo --preserve-env=PATH env HOME="$HOME" go test -tags=integration -run TestPrivilegedCaptureLifecycleAndTraffic -count=1 -v .
          ! ip link show dae-ebpf0
          ! ip netns list | grep -q '^dae-ebpf-inbound'
      - name: Commit generated provider source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/kern/tproxy.c ebpfinbound
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(ebpfinbound): materialize validated capture provider'
          git push origin HEAD:tmp/validate-ebpfinbound-one-shot-20260901
